version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mynotepad-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: libbook
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: .
    container_name: mynotepad-server
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: libbook
      TZ: Asia/Shanghai
      # 身份认证模式：mock（默认，本地联调）| code2session | face | pay
      AUTH_MODE: mock
      # code2session 模式需要（个人主体可用）：填入小程序 AppID 和 AppSecret
      WX_APPID: ""
      WX_SECRET: ""
      # 人脸核身（预留，需企业主体 + 行业资质）
      FACE_VERIFY_APPID: ""
      FACE_VERIFY_SECRET: ""
      # 微信支付密码验证（预留，需企业主体 + 商户号）
      WXPAY_MCHID: ""
      WXPAY_APIV3_KEY: ""
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mysql_data:
networks:
  app-network:
    driver: bridge
